name: Offline synthetic validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: pytest -q
      - run: alpha-discovery demo --output artifacts/demo
      - run: python scripts/verify_results.py
      - run: python scripts/check_internal_links.py --ref HEAD
      - run: python scripts/audit_release.py
